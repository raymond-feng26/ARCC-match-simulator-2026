<!doctype html>
<!-- ARCC Season 2 match simulator: 3v3 (Red and Blue: Hero, Engineer, Sentry), or the Red alliance
     against three fixed targets (?mode=targets). Split screen ?layout=quad (3v3 default) / single.
     Run: python3 -m http.server 8765 --directory Robomaster/match_sim, then open http://localhost:8765
     (ES modules do not load from file://). Online: https://arcc-match-sim.vercel.app (update with
     npx vercel --prod in this folder). Self-checks: ?test (console); 2D view: ?2d.
     Field data: scripts/gen_arcc_s2_field.py --sim-json match_sim/src/field_data.js -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCC Match Sim</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js"
} }
</script>
<style>
  :root { --bg: #15171b; --panel: rgba(22, 24, 29, 0.86); --line: #3a3e46; --text: #e6e8ec; --muted: #9aa0aa;
    --red: #e0453a; --blue: #3d7be0; --warn: #e8b53a; --good: #5fcf80; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  .panel { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    backdrop-filter: blur(4px); }
  .top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 8px 14px; text-align: center; }
  .score { display: flex; align-items: center; gap: 18px; justify-content: center; }
  .vp { font-size: 30px; font-weight: 700; min-width: 64px; }
  .vp.red { color: var(--red); text-align: right; } .vp.blue { color: var(--blue); text-align: left; }
  .clock { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .phase { color: var(--muted); font-size: 12px; }
  .gold { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .row { display: flex; gap: 6px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  button, select, input[type=number] { background: #2a2e35; color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 8px; font: inherit; }
  button:hover:not(:disabled) { background: #343943; } button:disabled { opacity: 0.45; }
  input[type=number] { width: 58px; }
  .cards { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 300px); }
  .cardrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { width: 236px; padding: 7px 9px; }
  .card.red { border-top: 3px solid var(--red); } .card.blue { border-top: 3px solid var(--blue); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 11px; }
  b.red { color: #ffb3aa; } b.blue { color: #b3ccff; }
  /* split screen: views (in #view, take the mouse for orbiting) and their overlays (in #ui) */
  .view-pane { position: absolute; }
  .view-pane.quad { box-shadow: inset 0 0 0 1px #2a2d33; }
  /* split screen: one compact bar at the top centre */
  .quadmode .top { display: flex; align-items: center; gap: 10px; padding: 4px 10px; }
  .quadmode .top .row { margin-top: 0; flex-wrap: nowrap; }
  .quadmode .vp { font-size: 22px; min-width: 34px; } .quadmode .clock { font-size: 18px; }
  .quadmode .score { gap: 8px; } .quadmode .gold { display: none; }
  .quadhud { position: absolute; pointer-events: none; }
  .top, .cards, .side { z-index: 20; }   /* panels above the split-screen strips (added after them); help 30 */
  .cards .card { background: rgba(22, 24, 29, 0.97); }
  .cards-open .quadhud .strip { display: none; }   /* the cards show the same */
  .quadcam { position: absolute; left: 8px; top: 8px; pointer-events: auto; }
  .quadcam select { font-size: 12px; padding: 2px 4px; background: rgba(42, 46, 53, 0.85); }
  .quadhud.right .quadcam { left: auto; right: 8px; }   /* clear of the top bar */
  .quadmode .top button { white-space: nowrap; }
  .strip { position: absolute; left: 8px; bottom: 8px; width: 250px; padding: 6px 8px; pointer-events: auto; }
  .pad { margin: 4px 0 6px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
  .head b { color: #ffd2cc; }
  .bar { position: relative; height: 16px; background: #0d0e11; border-radius: 4px; overflow: hidden; margin: 3px 0; }
  .bar.small { height: 11px; font-size: 10px; }
  .bar span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; }
  .bar.small span { line-height: 11px; font-size: 9px; color: #cfd3da; }
  .fill { height: 100%; } .fill.hp { background: #d9534a; } .fill.heat { background: #e08a2e; } .fill.cap { background: #4aa3d9; }
  .line { color: var(--muted); margin: 2px 0; display: flex; align-items: center; gap: 6px; }
  .line input[type=range] { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tools { display: flex; gap: 4px; align-items: center; }
  button.small { padding: 2px 7px; }
  .note { color: #c9b27a; }
  .keys { color: var(--muted); font-size: 11px; margin-top: 4px; line-height: 1.7; }
  .keys kbd { font-size: 10px; padding: 0 4px; }
  .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #2c3038; }
  .chip.bad { background: #6b2622; } .chip.warn { background: #6b5320; } .chip.info { background: #234a6b; }
  .side { position: absolute; right: 10px; top: 10px; width: 270px; padding: 8px 10px; max-height: calc(100% - 20px); overflow: auto; }
  .quadmode .side { top: auto; bottom: 10px; max-height: 45%; }
  .sidehead { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  .sideshow { position: absolute; right: 10px; top: 10px; z-index: 20; padding: 4px 10px; color: var(--muted); }
  .quadmode .sideshow { top: auto; bottom: 10px; }
  .hide-panels .sideshow { display: none; }
  .quadhud.single .quadcam { display: none; }   /* one view: the camera choice is in the top bar */
  .hostnote { margin-top: 4px; font-size: 11px; color: var(--warn); }
  /* online room screen */
  #lobby { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 30px 12px; box-sizing: border-box; }
  .lobbybox { width: 520px; max-width: 100%; padding: 16px 20px; }
  .lobbybox.wide { width: 860px; }
  .lobbybox h2 { margin: 0 0 8px; font-size: 18px; }
  .lobbybox h3 { margin: 4px 0 6px; font-size: 13px; color: var(--muted); }
  .lobbybox h4 { margin: 6px 0 4px; font-size: 12px; color: var(--muted); }
  .lobbybox label { display: flex; align-items: center; gap: 6px; margin: 6px 0; }
  .lobbybox input[type=text] { background: #2a2e35; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; font: inherit; }
  .lobbybox input.code, .lobbybox .code { font: 600 18px ui-monospace, monospace; letter-spacing: 2px; text-transform: uppercase; width: 110px; }
  .lobbybox .row.left { justify-content: flex-start; align-items: center; margin: 10px 0; }
  .roomhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .roomhead .muted { word-break: break-all; }
  .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .seatcol { display: flex; flex-direction: column; gap: 6px; }
  .seatcol.red h3 { color: #ff9a90; } .seatcol.blue h3 { color: #9fbcff; }
  .seatcol.spec { margin-top: 12px; }
  .specrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  button.seat { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 7px 10px; }
  button.seat.taken { background: #23262c; }
  button.seat.mine { outline: 2px solid var(--good); }
  button.seat span { font-size: 12px; color: var(--muted); }
  button.seat .ok { color: var(--good); }
  button.primary { background: #2f6b45; } button.on { background: #6b5320; }
  .countdown { font-size: 18px; font-weight: 700; color: var(--warn); }
  .lobbybox .bad { color: #ff9a90; } .lobbybox .warn { color: var(--warn); }
  .roomsettings { margin-top: 10px; }
  .cols2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 700px) { .seats, .cols2 { grid-template-columns: 1fr; } .specrow { grid-template-columns: 1fr 1fr; } }
  .toasts { position: absolute; right: 10px; top: 46px; width: 330px; display: flex; flex-direction: column; gap: 4px;
    z-index: 20; pointer-events: none; }
  .quadmode .toasts { top: auto; bottom: 46px; flex-direction: column-reverse; }
  .toast { padding: 5px 9px; font-size: 12px; color: var(--text); transition: opacity 0.5s; }
  .toast.bad { color: #ff9a90; } .toast.good { color: var(--good); } .toast.fade { opacity: 0; }
  .side h3 { margin: 6px 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .side label { display: flex; align-items: center; gap: 6px; margin: 4px 0; color: var(--text); }
  .side .sub { margin-top: 6px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
  .log div { font-size: 12px; color: var(--muted); margin: 2px 0; }
  .log .bad { color: #ff9a90; } .log .good { color: var(--good); }
  .help { z-index: 30; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
  .help.hidden { display: none; }
  .helpbox { max-width: 880px; max-height: 85vh; overflow: auto; padding: 14px 18px; }
  .helpbox h2 { margin: 0 0 6px; font-size: 17px; } .helpbox h4 { margin: 10px 0 4px; }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  td { padding: 1px 8px 1px 0; color: var(--muted); vertical-align: top; }
  kbd { background: #2a2e35; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); font: 12px ui-monospace, monospace; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .hide-panels .cards, .hide-panels .side { display: none; }
  @media (max-width: 900px) { .side { display: none; } .cards { max-width: calc(100% - 20px); } .cols { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui"></div>
<div id="lobby" class="hidden"></div>
<div id="loading">Loading physics…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
