# Cloudflare Worker for the match simulator's online rooms. From the match_sim folder:
#   npx wrangler login
#   npx wrangler deploy --config net/cloudflare/wrangler.toml
# Free plan: Workers + Durable Objects (SQLite-backed class, required on the free plan).
name = "arcc-match-rooms"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
